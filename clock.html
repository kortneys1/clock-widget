<!doctype html>
<!--
  Signage clock with optional logo. All options come from the URL query string:

    fontSize        px number, or "auto" (default) to scale with the screen
    fontColor       hex without '#', e.g. 000000           (default ffffff)
    fontFamily      any CSS font name, e.g. Arial          (default Arial)
    fontWeight      e.g. 400, 700                          (default 700)
    backgroundColor hex without '#', e.g. ffffff           (default 000000)
    format          12 or 24                               (default 12)
    ampm            1 to show am/pm in 12-hour mode        (default 0)
    seconds         1 to show seconds                      (default 0)
    date            1 to show the date under the time      (default 0)
    logo            image URL (PNG/SVG/JPG), or "none"     (default logo.png)
    logoPosition    top | bottom | left | right            (default bottom)
    logoSize        percent of screen height, e.g. 20      (default 20)
    debug           1 to show what the player's browser reports (screen size, logo status)

  Example:
    clock.html?logo=https://example.com/logo.png&logoPosition=top&backgroundColor=ffffff&fontColor=000000
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg, #000000);
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: var(--pad, 4vmin);
    padding: var(--pad, 4vmin);
    color: var(--fg, #ffffff);
    font-family: var(--font, Arial), sans-serif;
  }

  body.pos-top    { flex-direction: column; }
  body.pos-bottom { flex-direction: column-reverse; }
  body.pos-left   { flex-direction: row; }
  body.pos-right  { flex-direction: row-reverse; }

  #logo {
    display: none;
    height: var(--logo-size, 20vh);
    max-width: 80vw;
    object-fit: contain;
  }
  #logo.ready { display: block; }
  body.pos-left #logo, body.pos-right #logo { max-width: 35vw; }

  #clock {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }

  #time {
    font-size: var(--size, 22vmin);
    font-weight: var(--weight, 700);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  #ampm { font-size: 0.4em; margin-left: 0.15em; }

  #debug {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    background: #ffeb3b;
    color: #000;
    font: 600 28px/1.3 Arial, sans-serif;
    z-index: 10;
    word-break: break-all;
  }

  #date {
    display: none;
    font-size: calc(var(--size, 22vmin) * 0.22);
    margin-top: 0.4em;
    opacity: 0.8;
  }
</style>
</head>
<body class="pos-bottom">
  <img id="logo" alt="">
  <div id="clock">
    <div id="time"></div>
    <div id="date"></div>
  </div>

<script>
  var params = new URLSearchParams(location.search);
  var root = document.documentElement.style;

  function get(name, fallback) {
    var v = params.get(name);
    return v === null || v === '' ? fallback : v;
  }

  // Only accept 3/6/8-digit hex so a URL can't inject arbitrary CSS
  function hex(name, fallback) {
    var v = get(name, fallback).replace(/^#/, '');
    return /^([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v) ? '#' + v : '#' + fallback;
  }

  root.setProperty('--fg', hex('fontColor', 'ffffff'));
  root.setProperty('--bg', hex('backgroundColor', '000000'));
  root.setProperty('--font', '"' + get('fontFamily', 'Arial').replace(/["\\;{}]/g, '') + '"');
  root.setProperty('--weight', parseInt(get('fontWeight', '700'), 10) || 700);

  var fontSize = get('fontSize', 'auto');
  var autoSize = fontSize === 'auto' || isNaN(parseFloat(fontSize));
  if (!autoSize) {
    root.setProperty('--size', parseFloat(fontSize) + 'px');
  }

  var logoPercent = parseFloat(get('logoSize', '20')) || 20;

  // The visible area as the page actually lays out. Signage players' built-in browsers
  // don't always agree with innerHeight or CSS vh units, so everything is sized from this.
  function viewport() {
    var el = document.documentElement;
    return { w: el.clientWidth || window.innerWidth, h: el.clientHeight || window.innerHeight };
  }

  // True if the time or logo comes closer to an edge than the margin. Keeping that
  // margin also protects against TVs that crop the outer few percent of the picture.
  function overflows(vp) {
    var m = Math.min(vp.w, vp.h) * 0.04 - 1;
    var els = [document.getElementById('time')];
    var logoEl = document.getElementById('logo');
    if (logoEl.classList.contains('ready')) els.push(logoEl);
    for (var i = 0; i < els.length; i++) {
      var r = els[i].getBoundingClientRect();
      if (r.top < m || r.left < m || r.bottom > vp.h - m || r.right > vp.w - m) return true;
    }
    return false;
  }

  // In auto mode, start as tall as the screen and shrink until the clock fits
  // beside/under the logo, so the digits are as large as possible for distance viewing
  var fittedFor = '';
  function fit() {
    var vp = viewport();
    var unit = Math.min(vp.w, vp.h) / 100;
    root.setProperty('--pad', 4 * unit + 'px');
    root.setProperty('--logo-size', vp.h * logoPercent / 100 + 'px');
    fittedFor = vp.w + 'x' + vp.h;
    if (!autoSize) return;
    var size = vp.h;
    root.setProperty('--size', size + 'px');
    while (size > 10 && overflows(vp)) {
      size *= 0.95;
      root.setProperty('--size', size + 'px');
    }
  }
  window.addEventListener('resize', fit);

  // Keep the page hidden until the logo has loaded (or failed) and the text has been
  // sized around it, so each reload by the signage player appears in its final layout
  // instead of jumping. A cached logo loads almost instantly; the timeout is a safety net
  // so a slow logo never keeps the time off screen.
  function reveal() { fit(); document.body.style.visibility = 'visible'; }

  var logoUrl = get('logo', 'logo.png');
  if (logoUrl === 'none') logoUrl = '';
  if (logoUrl) {
    document.body.style.visibility = 'hidden';
    var logo = document.getElementById('logo');
    var revealed = false;
    function showPage() {
      if (revealed) return;
      revealed = true;
      reveal();
    }
    // A logo that arrives after the timeout is still shown, and the time re-fits around it
    logo.onload = function () { logo.classList.add('ready'); revealed ? fit() : showPage(); };
    logo.onerror = showPage;
    setTimeout(showPage, 2000);
    logo.src = logoUrl;
    var pos = get('logoPosition', 'bottom');
    if (['top', 'bottom', 'left', 'right'].indexOf(pos) !== -1) {
      document.body.className = 'pos-' + pos;
    }
  }

  var use24 = get('format', '12') === '24';
  var showAmPm = get('ampm', '0') === '1';
  var showSeconds = get('seconds', '0') === '1';
  var showDate = get('date', '0') === '1';
  var timeEl = document.getElementById('time');
  var dateEl = document.getElementById('date');
  if (showDate) dateEl.style.display = 'block';

  var lastLength = 0;

  // debug=1 prints what the player's browser reports along the top, so a photo of the
  // screen shows why a layout looks wrong on hardware we can't inspect directly
  var debugEl = null;
  if (get('debug', '0') === '1') {
    debugEl = document.createElement('div');
    debugEl.id = 'debug';
    document.body.appendChild(debugEl);
  }

  function showDebug(vp) {
    var logoEl = document.getElementById('logo');
    var logoState = !logoUrl ? 'off' :
                    logoEl.complete && logoEl.naturalWidth > 0 ? 'loaded' :
                    logoEl.complete ? 'FAILED' : 'loading';
    debugEl.textContent =
      'page ' + vp.w + '×' + vp.h +
      ' · window ' + window.innerWidth + '×' + window.innerHeight +
      ' · screen ' + screen.width + '×' + screen.height +
      ' · pixel ratio ' + (window.devicePixelRatio || 1) +
      ' · logo ' + logoState +
      ' · text ' + Math.round(parseFloat(getComputedStyle(timeEl).fontSize)) + 'px' +
      ' · cut off: ' + (overflows(vp) ? 'YES' : 'no') +
      ' · ' + navigator.userAgent;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function tick() {
    var now = new Date();
    var h = now.getHours();
    var suffix = '';
    if (!use24) {
      suffix = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
    }
    var text = (use24 ? pad(h) : h) + ':' + pad(now.getMinutes());
    if (showSeconds) text += ':' + pad(now.getSeconds());
    timeEl.innerHTML = text + (!use24 && showAmPm ? '<span id="ampm">' + suffix + '</span>' : '');

    // Re-fit when 9:59 -> 10:00 adds a digit, when the player changes the page size
    // without telling it (some don't fire resize events), or if anything is cut off
    var vp = viewport();
    if (text.length !== lastLength || vp.w + 'x' + vp.h !== fittedFor || overflows(vp)) {
      lastLength = text.length;
      fit();
    }
    if (debugEl) showDebug(vp);

    if (showDate) {
      dateEl.textContent = now.toLocaleDateString(undefined, {
        weekday: 'long', month: 'long', day: 'numeric'
      });
    }

    // Re-sync to the top of each second so the display never drifts
    setTimeout(tick, 1000 - now.getMilliseconds());
  }

  tick();
  if (!logoUrl) reveal();
</script>
</body>
</html>
